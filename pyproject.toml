[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sunnycrowd-alertthresh"
version = "0.1.0"
description = "用分位数与异常检测方法给出阈值建议，并估算误报频率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sunnycrowd" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sunnycrowd.github.io"
Repository = "https://github.com/sunnycrowd/alertthresh"
Issues = "https://github.com/sunnycrowd/alertthresh/issues"

[project.scripts]
alertthresh = "alertthresh:main"

[tool.setuptools]
py-modules = ["alertthresh"]
